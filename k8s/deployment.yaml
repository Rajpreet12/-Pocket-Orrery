apiVersion: apps/v1
kind: Deployment
metadata:
  name: pocket-orrery
  namespace: pocket-orrery
  labels:
    app: pocket-orrery
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: pocket-orrery
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0 # keep both pods serving until the new one is ready
      maxSurge: 1
  template:
    metadata:
      labels:
        app: pocket-orrery
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: pocket-orrery:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: pocket-orrery-config
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
