apiVersion: v1
kind: Service
metadata:
  name: pocket-orrery
  namespace: pocket-orrery
spec:
  type: NodePort
  selector:
    app: pocket-orrery
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080 # kind maps this to localhost:30080; Docker Desktop exposes it directly
